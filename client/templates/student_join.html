{% extends "base.html" %}
{% block title %}Join a Session{% endblock %}
{% block content %}
<h2>Join a session</h2>
<label>Session code
  <input id="session-code" type="text" maxlength="6" autocomplete="off">
</label>
<label>Full name
  <input id="full-name" type="text" autocomplete="off">
</label>
<button id="join-btn">Join</button>
<p id="join-error" class="error"></p>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script src="{{ url_for('static', filename='js/join.js') }}"></script>
{% endblock %}
